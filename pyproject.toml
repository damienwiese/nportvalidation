[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nport"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
]

[project.scripts]
nport = "nport.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nport"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/v1_13/eis_Common.xsd" = "nport/schemas/v1_13/eis_Common.xsd"
"schemas/v1_13/eis_ISO_StateCodes.xsd" = "nport/schemas/v1_13/eis_ISO_StateCodes.xsd"
"schemas/v1_13/eis_NPORT_common.xsd" = "nport/schemas/v1_13/eis_NPORT_common.xsd"
"schemas/v1_13/eis_NPORT_Filer.xsd" = "nport/schemas/v1_13/eis_NPORT_Filer.xsd"
"schemas/v1_13/eis_stateCodes.xsd" = "nport/schemas/v1_13/eis_stateCodes.xsd"

[tool.hatch.build.targets.sdist]
exclude = ["/archive", "/data", "/output", "/outputs", "/tmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
